# Local Supabase stack for the Kopano Renewal Desk.
# The ports are deliberately non-default (553xx) so this stack can run next to another local
# Supabase project (which uses 543xx). Start it with `npx supabase start` from this folder.
project_id = "kopano-renewal-desk"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = true

[db.seed]
# No SQL seed: `npm run seed` loads reference data (templates, price-plan rules) and the client's
# files through the app's own import code, so a fresh database and production load the same way.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/**", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Logins are created by a manager (or the seed script); nobody signs themselves up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 300
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327
